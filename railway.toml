# Deploy apps/api (NestJS) lên Railway.
#
# Vì sao Railway chứ không phải Vercel: API này có 4 Socket.IO gateway, một
# BullMQ worker chạy trong tiến trình, và hai @Interval 30 giây — tất cả đều
# cần một tiến trình sống dài. Vercel Functions là request/response.
#
# Chỉ apps/api ở đây. apps/web đi Vercel (xem vercel.json).

[build]
# DOCKERFILE chứ không phải NIXPACKS: image này đã được dùng và kiểm qua
# docker-compose, và nó xử lý đúng một chi tiết mà Nixpacks sẽ phải đoán —
# pnpm workspace hoist dependency vào node_modules/.pnpm ở gốc và để lại
# symlink trong apps/api/node_modules, nên phải copy cả cây /app thì symlink
# mới còn nguyên (xem comment trong apps/api/Dockerfile).
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
# Khớp với CMD trong Dockerfile. Khai lại ở đây để đổi lệnh chạy không phải
# build lại image.
#
# dist/SRC/main.js, không phải dist/main.js: apps/api/tsconfig.json không có
# rootDir nên tsc soi cả src/ lẫn test/ xuống dist/.
startCommand = "node apps/api/dist/src/main.js"

# /health là route duy nhất không qua guard. Railway coi deploy là thất bại
# nếu nó không xanh, tức là cấu hình sai (DB không tới được, thiếu biến) sẽ
# chặn deploy thay vì đẩy lên một instance chết.
healthcheckPath = "/health"
# 60s chứ không phải mặc định 30: lúc khởi động TypeORM mở kết nối tới
# Supabase ở Singapore và dựng 24 entity.
healthcheckTimeout = 60

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# KHÔNG đặt PORT ở đây. Railway tự tiêm nó, và main.ts đọc
# `process.env.PORT ?? 4000`. Đặt cứng sẽ làm Railway không route được.
#
# Cũng KHÔNG đổi `app.listen(port)` thành `app.listen(port, '0.0.0.0')`:
# Express không truyền host thì bind vào `::`, tức cả IPv6 lẫn IPv4. Private
# networking của Railway chỉ chạy IPv6 — ép về 0.0.0.0 là tự cắt nó đi.

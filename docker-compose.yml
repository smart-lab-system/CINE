services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lab_management
      POSTGRES_USER: lab_admin
      POSTGRES_PASSWORD: lab_admin_password
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_admin -d lab_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: lab_admin
      MONGO_INITDB_ROOT_PASSWORD: lab_admin_password
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6390:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lab_admin
      MINIO_ROOT_PASSWORD: lab_admin_password
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  minio_data:
